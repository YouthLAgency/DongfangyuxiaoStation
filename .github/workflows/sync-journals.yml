name: 同步机关刊物

on:
  schedule:
    # 每天北京时间 08:00（UTC 00:00）同步
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 同步刊物仓库
        run: node scripts/sync-journals.mjs

      - name: 提交变更
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A src/content/journals/
          if git diff --cached --quiet; then
            echo "无变更，跳过提交"
          else
            git commit -m "content: 同步机关刊物（自动）"
            git push
          fi
